[project]
name = "kids-story-builder"
version = "0.1.0"
description = "Small app to generate kid stories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "bitsandbytes>=0.49.2",
    "diffusers",
    "gradio>=6.16.0",
    "huggingface-hub>=1.18.0",
    "pillow>=12.2.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "soundfile>=0.14.0",
    "torch>=2.12.0",
    "transformers>=5.10.2",
    "voxcpm>=2.0.3",
]

[dependency-groups]
train = [
    "bitsandbytes>=0.49.2",
    "datasets>=3.6.0",
    "modal>=1.4.3",
    "trl>=0.29.1",
    "unsloth>=2025.9.5",
]
dev = [
    "sounddevice>=0.5.5",
]

[tool.uv.sources]
diffusers = { git = "https://github.com/huggingface/diffusers.git" }
